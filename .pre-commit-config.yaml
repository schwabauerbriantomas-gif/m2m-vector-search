# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Config coherente [audit r3b-07]: cada herramienta lee UNA config real —
#   black / isort / mypy -> [tool.black] / [tool.isort] / [tool.mypy] en pyproject.toml
#   flake8              -> .flake8 (flake8 no lee pyproject.toml)
#   bandit              -> [tool.bandit] de pyproject.toml, SOLO si se pasa -c pyproject.toml
# Los `rev` son tags cuyo commit se verificó contra la API de GitHub y coinciden con lo que
# resuelve `pip install -e ".[dev]"` hoy (black 26.10.1, flake8 7.5.0, isort 9.0.2,
# bandit 1.9.4), que es lo mismo que pinea el job `lint` de .github/workflows/ci.yml.
exclude: ^(docs/api/|\.bench/|\.smoke/|benchmarks/.*\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Los manifiestos de k8s (deploy/k8s/*.yaml) son multi-documento (`---`).
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      # Line length y target-version salen de [tool.black] de pyproject.toml.
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      # profile/line_length salen de [tool.isort] de pyproject.toml.
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      # max-line-length / ignore / exclude salen de .flake8.
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # mypy todavía NO es gate: da 155 errores en 27 archivos sobre el código actual
        # [audit r3b-07] y el pase de estilo de cierre (black + flake8) no los corrige.
        # Por eso corre sólo a pedido: `pre-commit run mypy --all-files`.
        stages: [manual]
        args: ['--ignore-missing-imports']
        exclude: ^tests/

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # `-c pyproject.toml` es obligatorio: sin ese flag bandit NO lee [tool.bandit]
        # (skips B101/B301/B324) y el hook falla por B324 en sharding.py:18 y gate_modulus.py:98.
        args: ['-ll', '-c', 'pyproject.toml']
        files: ^src/

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
