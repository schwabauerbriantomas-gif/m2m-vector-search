name: CI

# Jobs restaurados [audit r3b-08]: lint, test (con cobertura), build, security, docs y
# deploy-docs. Hasta acá sólo corría `test`.
#
# * Todas las actions están fijadas a un SHA de commit verificado contra la API de GitHub;
#   el tag del que salió queda en el comentario de la misma línea para poder actualizarlo.
# * Permisos mínimos: `contents: read` para todo el workflow; sólo deploy-docs agrega
#   `pages: write` + `id-token: write`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (black, flake8, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install tools
        # Mismas versiones que los hooks de .pre-commit-config.yaml, para que lo que pasa
        # acá sea lo mismo que pasa corriendo `pre-commit run --all-files` en local.
        run: python -m pip install "black==26.10.1" "flake8==7.5.0" "bandit==1.9.4"
      - name: black
        run: black --check --diff src tests
      - name: flake8
        # Lee .flake8 de la raíz del repo.
        run: flake8 src tests --count --show-source --statistics
      - name: bandit
        # bandit NO descubre [tool.bandit] solo: hay que pasarle el pyproject explícitamente.
        run: bandit -c pyproject.toml -r src/m2m -ll

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Medido en el host de desarrollo: la suite baja de 485 s a 228 s con un hilo de BLAS
      # (con los hilos por defecto, las ops chicas hacen spin-wait).
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      # Core de coverage.py sobre sys.monitoring: es con el que se midió el piso (70.57 %).
      # En Python < 3.12 coverage avisa y vuelve sola al core por defecto (ctrace).
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # Misma selección que siempre (not slow / integration / gpu / embeddings) + cobertura.
        # Piso 68 = 70.57 % medido con esta misma suite (branch coverage) redondeado hacia
        # abajo (70) menos 2 puntos: ver tests/README.md.
        run: >
          pytest tests/ --tb=short
          -m "not slow and not integration and not gpu and not embeddings"
          --cov=m2m --cov-report=term --cov-report=xml:coverage.xml
          --cov-fail-under=68
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: python-package-distro
          path: dist/
          retention-days: 14
          if-no-files-found: error

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package and tools
        run: python -m pip install -e ".[dev]" "bandit==1.9.4" pip-audit
      - name: Bandit (static analysis of src/)
        run: bandit -c pyproject.toml -r src/m2m -ll
      - name: pip-audit (known vulnerabilities in dependencies)
        # Audita los paquetes de terceros instalados (saltea m2m-vector-search, que es local
        # y no está en PyPI con esta versión). Falla si aparece una vulnerabilidad: si tiene
        # fix, se actualiza la dependencia; si NO tiene fix upstream, se agrega acá
        # `--ignore-vuln GHSA-xxxx` con un comentario con el ID, y se saca cuando salga el fix.
        run: pip-audit

  docs:
    name: Docs (API reference with pdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install package and pdoc
        run: python -m pip install -e ".[dev]" pdoc
      - name: Build API docs
        run: pdoc src/m2m --output-dir docs/api/
      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: docs-api
          path: docs/api/
          retention-days: 14
          if-no-files-found: error
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: docs/api/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: docs
    # Sólo en push a main: en PRs alcanza con el artifact `docs-api`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
