name: Benchmark

# Semanal y a mano. NO hay gates por tiempos: los runners de CI son ruidosos y un umbral
# de QPS/latencia acá daría rojo espurio. Los JSON quedan como artifact (90 días) para
# comparar contra runs anteriores [audit r3b-08].

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Un hilo de BLAS: mismo criterio que el job de test (comparable entre runs).
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run benchmarks
        # benchmarks/bench_lsh.py es la medición de latencia LSH vs scan exacto que antes
        # vivía en tests/test_lsh.py::test_lsh_speedup (assert de speedup = flaky bajo carga).
        run: |
          python scripts/run_benchmark.py 10000
          python benchmarks/bench_lsh.py --out benchmark_lsh.json
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.json
            benchmark_lsh.json
          retention-days: 90
          if-no-files-found: error
